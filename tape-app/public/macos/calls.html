<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kin calls</title>
<style>
  :root {
    --bg: #0e1014; --panel: #16191f; --line: #262b34;
    --fg: #e8eaf0; --dim: #8b93a3;
    --good: #35c46a; --warn: #e0a53a; --bad: #e8544f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 22px 24px 10px; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 13px; margin-top: 3px; }
  main { padding: 8px 24px 60px; max-width: 1400px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); font-weight: 600; margin: 26px 0 10px; }
  .call { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px; margin-bottom: 10px; }
  .call.live { border-color: #2c4a34; }
  .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--dim); }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 20px; font-weight: 600; }
  .badge.live { background: #16351f; color: var(--good); }
  .badge.done { background: #23262d; color: var(--dim); }
  .verdict { margin-left: auto; font-weight: 600; font-size: 13px; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); gap: 8px; }
  .m { background: #11141a; border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; }
  .m .k { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
  .m .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .m .n { font-size: 10px; color: var(--dim); }
  .m.good .v { color: var(--good); } .m.warn .v { color: var(--warn); } .m.bad .v { color: var(--bad); }
  .todo { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .t { border-left: 3px solid var(--line); padding: 4px 0 4px 9px; font-size: 13px; }
  .t.s3 { border-left-color: var(--bad); } .t.s2 { border-left-color: var(--warn); }
  .t.s1 { border-left-color: var(--dim); }
  .tw { display: block; font-weight: 600; }
  .ty { display: block; color: var(--dim); font-size: 12px; }
  .tf { display: block; font-size: 12px; color: #7fb0e8; }
  .ledger { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  .lrow { display: flex; gap: 10px; font-size: 12px; line-height: 1.7; }
  .lk { color: var(--dim); flex: 0 0 150px; text-transform: uppercase;
        font-size: 10px; letter-spacing: .05em; padding-top: 3px; }
  .lv { flex: 1; }
  .fix { margin-top: 10px; font-size: 13px; }
  .fix b { color: var(--bad); } .fix i { color: var(--good); font-style: normal; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--dim); font-weight: 600; font-size: 11px;
       text-transform: uppercase; letter-spacing: .05em; padding: 6px 10px 6px 0; }
  td { padding: 7px 10px 7px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  td.g { color: var(--good); } td.w { color: var(--warn); } td.b { color: var(--bad); }
  td.dim { color: var(--dim); }
  .empty { color: var(--dim); padding: 18px 0; }
  a { color: #79a6f6; }
  /* ── Crashes ──────────────────────────────────────────────────────────────
     Loud, because the whole point is that a crash on a Mac nobody is watching
     must be impossible to scroll past. The panel is silent when it is empty. */
  .call.crash { border-color: #5a2a28; background: #1a1315; }
  .badge.bad { background: #3a1d1c; color: var(--bad); }
  .headline { font-size: 15px; line-height: 1.45; margin: 2px 0 4px; }
  .headline code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .alarm { color: var(--bad); font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .byver { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .byver b { color: var(--fg); }
  .stack { margin-top: 9px; padding: 8px 10px; background: #11141a;
           border: 1px solid var(--line); border-radius: 7px;
           font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
           font-size: 11px; line-height: 1.55; color: var(--dim);
           white-space: pre; overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>Kin calls</h1>
  <div class="sub">Native macOS app. Live calls refresh every 3 seconds.
    Nothing here identifies a person or a room &mdash; the room name is the encryption key and is never sent.</div>
</header>
<main>
  <h2>Crashes</h2>
  <div id="crashes"><div class="empty">Loading&hellip;</div></div>
  <h2>Happening now</h2>
  <div id="live"><div class="empty">No call in progress.</div></div>
  <h2>Recent calls</h2>
  <div id="recent"><div class="empty">Loading&hellip;</div></div>
</main>
<script src="calls.js"></script>
</body>
</html>
