<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>lab: 3D studio stage</title>
<style>html,body{margin:0;background:#b6b8bd;overflow:hidden}canvas{display:block}</style>
<script src="../vendor/three-bundle.js"></script>
</head><body>
<canvas id="gl" width="1920" height="1080"></canvas>
<script>
// A white-studio product stage in three.js, deterministic in t: a seamless
// sweep, a soft key from upper-left with shadows, a room environment for
// reflections, and a rounded brushed-aluminium box. Exposes the flagship's
// render contract (window.kinAd.seek/duration) so ad/render.mjs can shoot it.
(function () {
  const T = window.THREE;
  const canvas = document.getElementById("gl");
  const renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(1); renderer.setSize(1920, 1080, false);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
  renderer.outputColorSpace = T.SRGBColorSpace;

  const scene = new T.Scene();
  scene.background = new T.Color("#c6c8cd");
  // reflections from a procedural room, no assets
  const pmrem = new T.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new T.RoomEnvironment(), 0.04).texture;

  const camera = new T.PerspectiveCamera(28, 1920 / 1080, 0.1, 100);
  camera.position.set(0, 1.35, 5.2); camera.lookAt(0, 0.35, 0);

  // the sweep: a floor that curves up into the backdrop
  const sweepGeo = new T.PlaneGeometry(40, 40, 1, 1);
  const sweepMat = new T.MeshStandardMaterial({ color: "#d3d5da", roughness: 0.95, metalness: 0 });
  const floor = new T.Mesh(sweepGeo, sweepMat); floor.rotation.x = -Math.PI / 2; floor.position.y = 0; floor.receiveShadow = true; scene.add(floor);
  const back = new T.Mesh(new T.PlaneGeometry(40, 20), new T.MeshStandardMaterial({ color: "#c9cbd0", roughness: 1 })); back.position.set(0, 10, -8); back.receiveShadow = true; scene.add(back);

  // lights: soft key upper-left, a cool fill from the right, a low bounce
  const key = new T.DirectionalLight("#fff6ea", 3.2); key.position.set(-4, 7, 4); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 8; key.shadow.camera.near = 1; key.shadow.camera.far = 30;
  key.shadow.camera.left = key.shadow.camera.bottom = -6; key.shadow.camera.right = key.shadow.camera.top = 6; scene.add(key);
  const fill = new T.DirectionalLight("#dfe7ff", 1.1); fill.position.set(5, 3, 2); scene.add(fill);
  scene.add(new T.HemisphereLight("#ffffff", "#8a8c92", 0.9));

  // the hero: a rounded aluminium box (a stand-in, not any real product)
  const boxGeo = new T.RoundedBoxGeometry(1.97, 0.5, 1.97, 6, 0.16);
  const alu = new T.MeshPhysicalMaterial({ color: "#cfd1d5", metalness: 0.85, roughness: 0.38, clearcoat: 0.15, clearcoatRoughness: 0.5, envMapIntensity: 1.1 });
  const box = new T.Mesh(boxGeo, alu); box.position.y = 0.25; box.castShadow = true; box.receiveShadow = true; scene.add(box);
  // a dark rubber foot ring and a small power light
  const ring = new T.Mesh(new T.TorusGeometry(0.78, 0.02, 12, 64), new T.MeshStandardMaterial({ color: "#1a1a1c", roughness: 0.9 })); ring.rotation.x = Math.PI / 2; ring.position.y = 0.012; scene.add(ring);
  const led = new T.Mesh(new T.SphereGeometry(0.02, 12, 12), new T.MeshStandardMaterial({ color: "#ffffff", emissive: "#ffffff", emissiveIntensity: 2 })); led.position.set(-0.7, 0.12, 0.99); scene.add(led);

  const DURATION = 6;
  function render(t) {
    // a slow push-in and a quarter turn, deterministic in t
    const u = Math.min(1, Math.max(0, t / DURATION));
    camera.position.set(Math.sin(u * 0.9) * 1.2, 1.35 - 0.25 * u, 5.2 - 1.6 * u); camera.lookAt(0, 0.3, 0);
    box.rotation.y = -0.35 + u * 0.9;
    renderer.render(scene, camera);
  }
  let _t = 0;
  window.kinAd = {
    duration: DURATION, get time() { return _t; },
    seek(t) { _t = t; const t0 = performance.now(); render(t); const ms = performance.now() - t0; window.__lastMs = ms; return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); },
    async renderScoreOffline(sr = 48000) { const n = Math.ceil(DURATION * sr); return [new Float32Array(n), new Float32Array(n)]; },
    transcript: [],
    // timing probe: render N frames, report ms per frame, and the GL renderer string
    async bench(n = 60) { const t0 = performance.now(); for (let i = 0; i < n; i++) render(i / 30); renderer.getContext().finish(); const ms = (performance.now() - t0) / n; const gl = renderer.getContext(); const dbg = gl.getExtension("WEBGL_debug_renderer_info"); return { msPerFrame: +ms.toFixed(2), renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "unknown" }; }
  };
  render(0);
})();
</script>
</body></html>
